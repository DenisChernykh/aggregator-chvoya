<!doctype html>
<html lang="ru">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Отель "Хвоя"</title>
</head>

<body>
	<header class="header" data-header>
		<div class="header__desktop">
			<div class="header__desktop-group header__desktop-group--start">
				<button class="header__menu-toggle header__menu-toggle--desktop" type="button" data-header-menu-toggle
					aria-label="Открыть меню" aria-controls="header-menu" aria-expanded="false">
					<span class="header__burger header__burger--desktop" aria-hidden="true">
						<span></span>
						<span></span>
					</span>
					<span>Меню</span>
				</button>

				<a class="header__taxi-link" href="#">Вызвать такси</a>
			</div>

			<a class="header__logo header__logo--desktop" href="/" aria-label="Хвоя">
				<img src="/assets/images/header/logo-compact.svg" alt="Хвоя">
			</a>

			<div class="header__desktop-group header__desktop-group--end">
				<a class="header__phone" href="tel:+79990000000">+7 (999) 999-99-99</a>
				<a href="#rooms" class="header__button header__button--primary button button--primary">Найти номер</a>
			</div>
		</div>

		<div class="header__mobile">
			<div class="header__mobile-bar">
				<a class="header__mobile-phone" href="tel:+79990000000" aria-label="Позвонить"></a>

				<a class="header__logo header__logo--mobile" href="/" aria-label="Хвоя">
					<img src="/assets/images/header/logo-compact.svg" alt="Хвоя">
				</a>

				<button class="header__menu-toggle header__menu-toggle--mobile" type="button" data-header-menu-toggle
					aria-label="Открыть меню" aria-controls="header-menu" aria-expanded="false">
					<span class="header__burger header__burger--mobile" aria-hidden="true">
						<span></span>
						<span></span>
					</span>
				</button>
			</div>
		</div>

		<div class="header__menu" id="header-menu" data-header-menu aria-hidden="true">
			<div class="header__menu-inner">
				<nav class="header__menu-nav" aria-label="Основная навигация">
					<ul class="header__menu-nav-list">
						<li><a href="#booking-start">Об отеле</a></li>
						<li><a href="#rooms">Номера</a></li>
						<li><a href="#promos">Акции</a></li>
						<li><a href="#services">Услуги</a></li>
						<li><a href="#reviews">Отзывы</a></li>
						<li><a href="#gallery">Галерея</a></li>
						<li><a href="#blog">Статьи</a></li>
						<li><a href="#contacts">Контакты</a></li>
					</ul>
				</nav>

				<div class="header__menu-footer">
					<a href="#rooms" class="header__menu-button button button--primary">Найти номер</a>

					<div class="header__socials" aria-label="Социальные сети">
						<a class="social-link social-link--menu" href="#" aria-label="Telegram">
							<img src="/assets/images/icons/telegram.svg" alt="">
						</a>
						<a class="social-link social-link--menu" href="#" aria-label="ВКонтакте">
							<img src="/assets/images/icons/vk.svg" alt="">
						</a>
						<a class="social-link social-link--menu" href="#" aria-label="Rutube">
							<img src="/assets/images/icons/rutube.svg" alt="">
						</a>
						<a class="social-link social-link--menu" href="#" aria-label="Одноклассники">
							<img src="/assets/images/icons/ok.svg" alt="">
						</a>
					</div>
				</div>
			</div>
		</div>
	</header>
