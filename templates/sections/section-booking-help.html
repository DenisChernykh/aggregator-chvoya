<section class="section booking-help section--curved-caps" id="booking-help" aria-labelledby="booking-help-title" data-header-surface="dark">
  <div class="container">
    <div class="booking-help__panel">
      <picture class="booking-help__bg">
        <source srcset="/assets/images/booking-help/summer-package-desktop.webp" media="(min-width: 768px)">
        <img src="/assets/images/booking-help/summer-package-mobile.webp" alt="" loading="lazy">
      </picture>
      <div class="booking-help__overlay" aria-hidden="true"></div>
      <div class="booking-help__content">
        <div class="booking-help__info">
          <div class="section-header">
            <h2 class="section-title" id="booking-help-title">Пакет «Летний побег» на&nbsp;2&nbsp;ночи</h2>
            <div class="section-text">Идеальный сценарий для перезагрузки. В&nbsp;стоимость включено: проживание в&nbsp;панорамном А-фрейме, завтраки на&nbsp;террасе и&nbsp;безлимитная вечерняя растопка купели фурако.</div>
          </div>
          <div class="booking-help__contacts">
            <a class="booking-help__phone" href="tel:+79999999999">+7 (999) 999-99-99</a>
            <div class="booking-help__socials" aria-label="Социальные сети">
              <a class="booking-help__social booking-help__social--vk social-link social-link--sm social-link--vk" href="#" aria-label="ВКонтакте">
                <img src="/assets/images/icons/vk.svg" alt="" loading="lazy">
              </a>
              <a class="booking-help__social booking-help__social--max social-link social-link--sm social-link--max" href="#" aria-label="MAX">
                <img src="/assets/images/icons/max.svg" alt="" loading="lazy">
              </a>
            </div>
          </div>
        </div>
        <div class="booking-help__actions">
          <a class="booking-help__button button button--primary" href="#rooms">Найти номер</a>
          <button data-modal-id="modalContact" class="booking-help__button button button--glass-arrow" type="button">Связаться с нами</button>
        </div>
      </div>
    </div>
  </div>
</section>
