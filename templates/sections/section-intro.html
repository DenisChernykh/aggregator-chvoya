<div class="intro" data-header-surface="dark">
  <div class="intro__bg">
    <picture>
      <source srcset="/assets/images/intro/hero-desktop.png" type="image/png" media="(min-width: 768px)">
      <img src="/assets/images/intro/hero-mobile.png" alt="">
    </picture>
  </div>
  <div class="container">
    <div class="intro__content">
      <div class="intro-rating" aria-label="Рейтинг 5,0 на Яндексе, отзывов 300+">
        <img class="intro-rating__logo" src="/assets/images/icons/yandex-good-place.svg" alt="">
        <div class="intro-rating__stars" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
        <strong>5,0</strong>
        <span class="intro-rating__reviews">Отзывов 300+</span>
      </div>

      <div class="intro__copy">
        <h1 class="intro__title">Панорамные эко-дома в&nbsp;густом хвойном лесу</h1>
        <div class="intro__text">
          Приватный отдых с&nbsp;отельным сервисом. Тёплые А-фреймы, банный комплекс и&nbsp;ресторан авторской кухни всего в&nbsp;45&nbsp;минутах езды от&nbsp;центра.
        </div>
      </div>

      <div class="intro-route-card" aria-label="Контакты и маршрут">
        <a class="intro-route-card__link" href="#contacts" aria-label="Проложить маршрут"></a>

        <div class="intro-route-card__content">
          <div class="intro-route-card__action" aria-hidden="true">
            <span>Проложить маршрут</span>
          </div>

          <div class="intro-route-card__map" aria-hidden="true">
            <iframe
              src="https://yandex.ru/map-widget/v1/?um=constructor%3Aa2402a03fbbb6880eabf2745efdf7259b0e6224d00049b5b7003954e0d54980d&amp;source=constructor"
              width="100%"
              height="473"
              frameborder="0"
              loading="lazy"
              tabindex="-1"
            ></iframe>
          </div>
        </div>

        <div class="intro-route-card__details">
          <div class="intro-route-card__item intro-route-card__item--address">
            <span>г. Москва, Малый Козихинский переулок, д. 14, стр. 1</span>
          </div>
          <div class="intro-route-card__item intro-route-card__item--time">
            <span>Ежедневно: с&nbsp;9:00&nbsp;до&nbsp;22:00</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
