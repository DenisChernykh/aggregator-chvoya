<section class="section atmosphere" id="atmosphere" aria-labelledby="atmosphere-title" data-header-surface="light">
  <div class="container">
    <div class="section-header">
      <h2 class="section-title" id="atmosphere-title">Почувствуйте атмосферу «Хвои»</h2>
      <div class="section-text">Меньше минуты, чтобы влюбиться в&nbsp;это место. Посмотрите, как проходит день в&nbsp;нашем лесном отеле: от&nbsp;утреннего кофе с&nbsp;видом на&nbsp;сосны до&nbsp;вечерних бесед у&nbsp;костра.</div>
    </div>
    <div class="atmosphere__video" data-lazyvideo-click>
      <video class="atmosphere__media" poster="/assets/images/figma/atmosphere-preview.webp" preload="metadata" playsinline data-lazyvideo="reset" data-lazyvideo-autoplay="false">
        <source data-src="/assets/images/highlight/video.webm" type="video/webm">
      </video>
      <button class="atmosphere__play button button--glass" type="button" data-lazyvideo-button>
        <span>Смотреть</span>
        <span class="atmosphere__play-icon" aria-hidden="true">
          <img src="/assets/images/atmosphere/play.svg" alt="" loading="lazy">
        </span>
      </button>
    </div>
  </div>
</section>
