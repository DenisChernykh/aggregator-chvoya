<section class="section booking-panel section--curved-caps" id="booking" aria-labelledby="booking-title" data-header-surface="dark">
	<div class="container">
		<div class="booking-panel__panel">
			<picture class="booking-panel__bg">
				<source srcset="/assets/images/booking-help/summer-package-desktop.webp" media="(min-width: 768px)">
				<img src="/assets/images/booking-help/summer-package-mobile.webp" alt="" loading="lazy">
			</picture>
			<div class="booking-panel__overlay" aria-hidden="true"></div>
			<div class="booking-panel__content">
				<div class="booking-panel__info">
					<div class="section-header">
						<h2 class="section-title" id="booking-title">Готовы к&nbsp;перезагрузке?</h2>
						<div class="section-text">Выберите удобные свободные даты и&nbsp;быстро забронируйте свой уютный домик «Хвоя» всего за&nbsp;пару минут. Ваш личный лесной уголок находится всего в&nbsp;часе езды от&nbsp;города, где вы&nbsp;сможете насладиться тишиной и&nbsp;природой.</div>
					</div>
					<div class="booking-panel__contacts">
						<a class="booking-panel__phone" href="tel:+79999999999">+7 (999) 999-99-99</a>
						<div class="booking-panel__socials" aria-label="Социальные сети">
							<a class="booking-panel__social booking-panel__social--vk social-link social-link--sm social-link--vk" href="#" aria-label="ВКонтакте">
								<img src="/assets/images/icons/vk.svg" alt="" loading="lazy">
							</a>
							<a class="booking-panel__social booking-panel__social--max social-link social-link--sm social-link--max" href="#" aria-label="MAX">
								<img src="/assets/images/icons/max.svg" alt="" loading="lazy">
							</a>
						</div>
					</div>
				</div>
				<div class="booking-panel__actions">
					<a class="booking-panel__button button button--primary" href="#rooms">Найти номер</a>
					<button data-modal-id="modalContact" class="booking-panel__button button button--glass-arrow" type="button">Связаться с нами</button>
				</div>
			</div>
		</div>
	</div>
</section>
